name: Deploy static site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify generated pages
        run: |
          node scripts/sync-shared-layout.mjs
          git diff --exit-code

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        id: artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/github-script@v8
        timeout-minutes: 32
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const deploy = require('./.github/scripts/deploy-pages.cjs')
            await deploy({ github, context, core })
